name: MultiSwitcher CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        macos: [macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.macos }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run core checks
        run: swift run --package-path macos MultiSwitcherCoreTests
      - name: Check signed appcast release gate
        run: python3 scripts/test_sparkle_appcast_validator.py
      - name: Check selected-text conversion with native keyboard maps
        run: bash scripts/check_selection_conversion.sh
      - name: Build arm64 app bundle
        env:
          MULTISWITCHER_SIGN_IDENTITY: "-"
          MULTISWITCHER_ENABLE_CRASH_REPORTING: "1"
          MULTISWITCHER_BUILD_ROOT: ${{ runner.temp }}/MultiSwitcher-CI-build
        run: bash macos/build_app.sh
      - name: Compile Sparkle updater branch
        env:
          MULTISWITCHER_ENABLE_UPDATES: "1"
        run: swift build --package-path macos --product MultiSwitcher
