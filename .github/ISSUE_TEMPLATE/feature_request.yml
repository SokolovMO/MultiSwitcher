name: Предложение / Feature request
description: Предложите улучшение MultiSwitcher. Можно на русском или английском.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить?
      description: Опишите сценарий без личных данных. Можно писать по-русски или по-английски.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Какого поведения вы ожидаете?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Какие варианты вы уже пробовали?
    validations:
      required: false
