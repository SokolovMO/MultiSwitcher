name: Ошибка / Bug report
description: Опишите воспроизводимую ошибку без личных данных. Можно на русском или английском.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Используйте вымышленные примеры. Не публикуйте пароли, реальные сообщения, приватные ссылки, буфер обмена и необработанные журналы. Можно писать по-русски или по-английски.
  - type: input
    id: app-version
    attributes:
      label: Версия и сборка MultiSwitcher
      placeholder: "0.4.4 (76)"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: Версия macOS
      placeholder: "macOS 27.0.1"
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Где возникла ошибка?
      options:
        - Spotlight
        - Safari address bar
        - Safari text field
        - Chrome text field
        - Codex
        - Cursor
        - TextEdit
        - Finder or System Settings search
        - Terminal or iTerm
        - Другое / Other
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Какая функция не сработала?
      options:
        - Automatic layout correction
        - Option conversion
        - Undo with Option
        - Selected-text conversion
        - Rules or learning
        - Install or update
        - Другое / Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Используйте вымышленный текст вроде `ghbdtn`, не реальные сообщения.
      placeholder: |
        1. Откройте новое пустое текстовое поле.
        2. Наберите вымышленный пример и нажмите пробел.
        3. Опишите результат без личных данных.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: dropdown
    id: repeatability
    attributes:
      label: Как часто возникает ошибка?
      options:
        - Каждый раз
        - Иногда
        - Один раз
        - Не уверен
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: Я использовал вымышленные примеры; в отчёте нет личных текстов, ключей и необработанных журналов.
          required: true
