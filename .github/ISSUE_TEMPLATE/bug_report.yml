name: Bug report
description: Report a reproducible MultiSwitcher problem without sharing private text.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please use synthetic text in examples. Do not post passwords, real messages, URLs containing private data, clipboard contents, or raw diagnostic logs. The app does not upload typed text automatically.
  - type: input
    id: app-version
    attributes:
      label: MultiSwitcher version and build
      placeholder: "0.3.3 (22)"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 27.0.1"
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Where did it happen?
      options:
        - Spotlight
        - Safari address bar
        - Safari text field
        - Chrome text field
        - Codex
        - Cursor
        - TextEdit
        - Finder or System Settings search
        - Terminal or iTerm
        - Other
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Which action failed?
      options:
        - Automatic layout correction
        - Option conversion
        - Undo with Option
        - Selected-text conversion
        - Rules or learning
        - Install or update
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use generic sample text such as `ghbdtn` and avoid real content.
      placeholder: |
        1. Open a new empty text field.
        2. Type a synthetic sample and press Space.
        3. Describe the result without pasting private text.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: dropdown
    id: repeatability
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Happened once
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used synthetic examples and checked that this report contains no private text, credentials, or raw logs.
          required: true
