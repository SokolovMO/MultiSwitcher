<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">MultiSwitcher</title>
  <desc id="desc">A native macOS keyboard layout switcher. ghbdtn becomes привет.</desc>
  <rect width="1280" height="400" fill="#ffffff"/>
  <rect x="48" y="44" width="84" height="84" rx="21" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="90" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-4" fill="#1f2328">AЯ</text>
  <text x="158" y="103" font-family="Helvetica,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-2" fill="#1f2328">MultiSwitcher</text>
  <text x="50" y="255" font-family="Menlo,Consolas,monospace" font-size="76" fill="#59636e">ghbdtn</text>
  <path d="M400 230h76m-20-20 20 20-20 20" fill="none" stroke="#59636e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="518" y="255" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="600" letter-spacing="-3" fill="#1f2328">привет</text>
  <rect x="836" y="181" width="4" height="90" rx="2" fill="#1f2328"/>
  <text x="50" y="340" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#59636e">Russian ↔ English. Right from your menu bar.</text>
</svg>
